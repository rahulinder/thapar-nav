<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="/Projects/Software Enginnering/Admin/CSS/account-settings.css">
    <link rel="icon" type="image/svg" href="/Projects/Software Enginnering/assets/light-mode/side-bar/user.svg">
</head>

<body>
    <div id="top-bar">
        <img id="side-bar-logo" src="..\..\assets\light-mode\ti-logo.svg">
        <input id="search-bar" type="text" placeholder="Sitewide search">
        <span id="top-bar-credentials">
            <img id="top-bar-pp" src="..\..\assets\photots\jeet.jpg">
            <p id="top-bar-details">
                Admin ID: 12345678
                <br>
                Admin Name: John Doe
            </p>
        </span>
    </div>
    <div id="main-dashboard">
        <div id="side-bar">
            <img class="side-bar-icons" src="/Projects/Software Enginnering/assets/light-mode/side-bar/menu.svg">
            <img class="side-bar-icons" src="/Projects/Software Enginnering/assets/light-mode/side-bar/user.svg">
            <img class="side-bar-icons" src="/Projects/Software Enginnering/assets/light-mode/side-bar/driver.svg">
            <img class="side-bar-icons" src="/Projects/Software Enginnering/assets/light-mode/side-bar/database.svg">
            <img class="side-bar-icons" src="/Projects/Software Enginnering/assets/light-mode/side-bar/analytics.svg">
            <img class="side-bar-icons" id="settings-logout"
                src="/Projects/Software Enginnering/assets/light-mode/side-bar/settings.svg">
            <img class="side-bar-icons" id="logout"
                src="/Projects/Software Enginnering/assets/light-mode/side-bar/logout.svg">
        </div>
        <div id="dashboard-2">
            <!-- student Data-->
            <div id="title">
                <img src="/Projects/Software Enginnering/assets/light-mode/arrow-to-left.svg">
                <h3>Account Settings</h3>
            </div>
            <div class="outer-card">
                <div class="inner-card top-card" id="user-profile-picture">
                    <p class="labels">Profile Picture</p>
                    <img class="edit" src="/Projects/Software Enginnering/assets/light-mode/settings/edit.svg">
                    <img id="profile-picture" class="values" src="/Projects/Software Enginnering/assets/photots/jeet.jpg">
                </div>
                <div class="inner-card" id="user-name">
                    <p class="labels">Name</p>
                    <img class="edit" src="/Projects/Software Enginnering/assets/light-mode/settings/edit.svg">
                    <p class="values">Jeetinder Singh Badesha</p>

                </div>
                <div class="inner-card" id="user-email">
                    <p class="labels">Email</p>
                    <img class="edit" src="/Projects/Software Enginnering/assets/light-mode/settings/edit.svg">
                    <p class="values">jbadesha_be24@thapar.edu</p>

                </div>
                <div class="inner-card" id="user-phone-number">
                    <p class="labels">Phone Number</p>
                    <img class="edit" src="/Projects/Software Enginnering/assets/light-mode/settings/edit.svg">
                    <p class="values">8872800036</p>

                </div>
                <div class="inner-card bottom-card" id="user-password">
                    <p class="labels">Password</p>
                    <img class="edit" src="/Projects/Software Enginnering/assets/light-mode/settings/edit.svg">
                    <p class="values" id="password-dots">············</p>

                </div>
            </div>
        </div>
</body>

</html>
