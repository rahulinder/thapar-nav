name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health endpoint
        run: curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 https://thapar-nav.onrender.com/api/health
