<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="/admin-dashboard/css/settings.css">
    <link rel="icon" type="image/svg" href="/assets/admin-panel/favicon/settings.svg">
</head>
<body>
    <div id="top-bar">
        <img id="side-bar-logo" src="/assets/common/ti-logo-without-name.svg">
        <input id="search-bar" type="text" placeholder="Sitewide search">
        <span id="top-bar-credentials">
            <img id="top-bar-pp" src="/assets/admin-panel/photots/jeet.jpg">
            <p id="top-bar-details">
                Admin ID: 12345678
                <br>
                Admin Name: John Doe
            </p>
        </span>
    </div>
    <div id="main-dashboard">
        <div id="side-bar">
            <img class="side-bar-icons" src="/assets/admin-panel/side-bar/menu.svg">
            <img class="side-bar-icons" src="/assets/admin-panel/side-bar/user.svg">
            <img class="side-bar-icons" src="/assets/admin-panel/side-bar/driver.svg">
            <img class="side-bar-icons" src="/assets/admin-panel/side-bar/database.svg">
            <img class="side-bar-icons" src="/assets/admin-panel/side-bar/analytics.svg">
            <img class="side-bar-icons" id="settings-logout" src="/assets/admin-panel/side-bar/settings.svg">
            <img class="side-bar-icons" id="logout" src="/assets/admin-panel/side-bar/logout.svg">
        </div>
        <div id="dashboard-2">
            <!-- Users Data-->
             <div id="title">
                <img src="/assets/admin-panel/settings/arrow-to-left.svg">
                <h3>Settings</h3>
            </div>
            <div id="account-settings-card">
                <span>
                    <p class="data-titles">Account Settings</p>
                    <img src="/assets/admin-panel/settings/arrow-to-right.svg">
                </span>
            </div>
            <div id="theme-settings-card">
                <span>
                    <p class="data-titles">Theme</p>
                    <img src="/assets/admin-panel/settings/arrow-to-right.svg">
                </span>
            </div>
            <div id="accessibility-settings-card">
                <span>
                    <p class="data-titles">Accessibility</p>
                    <img src="/assets/admin-panel/settings/arrow-to-right.svg">
                </span>
            </div>
        </div>
    </div>
    <div id="bottom-bar">
        <p>Contact IT Department 8872800036</p>
    </div>
</body>
</html>
