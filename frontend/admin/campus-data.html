<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Data</title>

    <link rel="stylesheet" href="./css/campus-data.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">
    <link rel="icon" type="image/svg" href="/assets/admin-panel/favicon/database.svg">
</head>
<body>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <div class="outer-card">
                <span id="title-container">
                    <img id="title-arrow" src="/assets/admin-panel/campus-data/arrow-to-left-white.svg">
                    <p id="title">Campus Data</p>
                </span>
                <span class="inner-cards top-inner-card">
                    <p class="card-title">Accommodations</p>
                    <img class="inner-card-arrow" src="/assets/admin-panel/campus-data/arrow-to-right.svg">
                </span>
                <span class="inner-cards">
                    <p class="card-title">Shops</p>
                    <img class="inner-card-arrow" src="/assets/admin-panel/campus-data/arrow-to-right.svg">
                </span>
                <span class="inner-cards">
                    <p class="card-title">Class Blocks</p>
                    <img class="inner-card-arrow" src="/assets/admin-panel/campus-data/arrow-to-right.svg">
                </span>
                <span class="inner-cards">
                    <p class="card-title">Parks & Grounds</p>
                    <img class="inner-card-arrow" src="/assets/admin-panel/campus-data/arrow-to-right.svg">
                </span>
                <span class="inner-cards bottom-inner-card">
                    <p class="card-title">Other Areas</p>
                    <img class="inner-card-arrow" src="/assets/admin-panel/campus-data/arrow-to-right.svg">
                </span>
            </div>
        </div>
    </div>
    <script src="./js/topbar-and-sidebar.js"></script>
</body>
</html>
