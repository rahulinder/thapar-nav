<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="./css/account-settings.css">
    <link rel="icon" type="image/svg" href="/assets/admin-panel/settings/settings.svg">
</head>

<body>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
    <div id="sidebar-container"></div>
    <div id="main-container">
            <!-- student Data-->
            <div id="title">
                <img src="/assets/admin-panel/arrow-to-left.svg">
                <h3>Account Settings</h3>
            </div>
            <div class="outer-card">
                <div class="inner-card top-card" id="user-profile-picture">
                    <p class="labels">Profile Picture</p>
                    <img class="edit" src="/assets/admin-panel/settings/edit.svg">
                    <img id="profile-picture" class="values" src="/assets/admin-panel/photots/profile-image.jpg">
                </div>
                <div class="inner-card" id="user-name">
                    <p class="labels">Name</p>
                    <img class="edit" src="/assets/admin-panel/settings/edit.svg">
                    <p class="values">Jeetinder Singh Badesha</p>

                </div>
                <div class="inner-card" id="user-email">
                    <p class="labels">Email</p>
                    <img class="edit" src="/assets/admin-panel/settings/edit.svg">
                    <p class="values">jbadesha_be24@thapar.edu</p>

                </div>
                <div class="inner-card" id="user-phone-number">
                    <p class="labels">Phone Number</p>
                    <img class="edit" src="/assets/admin-panel/settings/edit.svg">
                    <p class="values">8872800036</p>

                </div>
                <div class="inner-card bottom-card" id="user-password">
                    <p class="labels">Password</p>
                    <img class="edit" src="/assets/admin-panel/settings/edit.svg">
                    <p class="values" id="password-dots">············</p>

                </div>
            </div>
        </div>
        
</body>

</html>
