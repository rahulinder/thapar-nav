<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thapar-Nav</title>

    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" type="img/xml" href="assets/client-assets/favicon/ti-logo-without-name.svg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" defer/>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="./js/script.js" defer></script>
</head>
<body>
<main>
    <section id="logo-and-search">
        <img id="logo" src="./assets/common-assets/ti-logo-with-white-name.svg">
        <div id="search-bar">
            <input type="text" placeholder="Search Places">
        </div>
    </section>
    <section id="cards-section">


        <!-- map -->
        <div id="home-map" class="cards">
            <div id="map" class="live-map-background"></div>

            <div class="card-details">
                <div>
                    <img src="./assets/client-interface/cards/icons/current-location-icon.svg">
                    <h1 class="location-name">Main Gate</h1>
                </div>
                <button class="route-button">Start Exploring</button>
            </div>
        </div>


        <!-- location cards -->
         <div class="horizontal-scroll-blocks" id="hostels">
            <h3 class="horizontal-scroll-titles">
                Hostels
            </h3>
             <div class="horizontal-scroll-container">
                <div class="cards">
                    <div class="card-details">
                        <h1 class="location-name">Hostel O<p class="name-in-brackets">(Vyom Hall)</p></h1>
                        <button class="route-button">Start Route</button>
                    </div>
                </div>
                <button class="see-all-button">
                    See all Hostels →
                </button>
            </div>
        </div>
         <div class="horizontal-scroll-blocks" id="cafe-and-canteen">
            <h3 class="horizontal-scroll-titles">
                Café & Canteens
            </h3>
             <div class="horizontal-scroll-container">
                <div class="cards">
                    <div class="card-details">
                        <h1 class="location-name">Hostel O<p class="name-in-brackets">(Vyom Hall)</p></h1>
                        <button class="route-button">Start Route</button>
                    </div>
                </div>
                <button class="see-all-button">
                    See all Hostels →
                </button>
            </div>
        </div>
         <div class="horizontal-scroll-blocks" id="shops">
            <h3 class="horizontal-scroll-titles">
                Shops
            </h3>
             <div class="horizontal-scroll-container">
                <div class="cards">
                    <div class="card-details">
                        <h1 class="location-name">Hostel O<p class="name-in-brackets">(Vyom Hall)</p></h1>
                        <button class="route-button">Start Route</button>
                    </div>
                </div>
                <button class="see-all-button">
                    See all Hostels →
                </button>
            </div>
        </div>
        


    </section>
    <div id="nav-bar">
        <img class="nav-icons" src="./assets/client-interface/nav-bar/Home.svg">
        <img class="nav-icons" src="./assets/client-interface/nav-bar/Support.svg">
        <img class="nav-icons" src="./assets/client-interface/nav-bar/Menu.svg">
    </div>
</main>
</body>
</html>
