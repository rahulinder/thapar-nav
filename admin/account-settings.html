<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/account-settings.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">
    <link rel="icon" type="image/svg" href="./assets/admin-panel/settings/settings.svg">
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <div class="outer-card">
                <span id="title-container">
                    <img id="title-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-left-white.svg">
                    <p id="title">Account Settings</p>
                </span>
                <div class="inner-cards top-inner-card photo-card">
                    <p class="card-title">Profile Picture</p>
                    <div class="photo-actions">
                        <button type="button" id="photo-change">Change</button>
                        <button type="button" id="photo-remove">Remove</button>
                    </div>
                    <img id="profile-photo" alt="Profile picture" src="./assets/admin-panel/photots/profile-image.jpg">
                    <input type="file" id="photo-input" accept="image/*" hidden>
                </div>
                <div class="inner-cards static-card">
                    <p class="card-title">Username</p>
                    <p class="value" id="value-username"></p>
                </div>
                <div class="inner-cards editable" data-field="displayName" data-label="Name" data-type="text" data-max="60" data-autocomplete="name">
                    <p class="card-title">Name</p>
                    <p class="value" data-value></p>
                    <button type="button" class="edit-btn">Edit</button>
                </div>
                <div class="inner-cards editable" data-field="email" data-label="Email" data-type="email" data-max="120" data-autocomplete="email">
                    <p class="card-title">Email</p>
                    <p class="value" data-value></p>
                    <button type="button" class="edit-btn">Edit</button>
                </div>
                <div class="inner-cards editable" data-field="phone" data-label="Phone Number" data-type="tel" data-max="20" data-autocomplete="tel">
                    <p class="card-title">Phone Number</p>
                    <p class="value" data-value></p>
                    <button type="button" class="edit-btn">Edit</button>
                </div>
                <div class="inner-cards bottom-inner-card" id="password-card">
                    <p class="card-title">Password</p>
                    <p class="value">············</p>
                    <button type="button" class="edit-btn" id="password-edit">Change</button>
                </div>
                <form id="password-form" class="edit-panel" hidden>
                    <input type="password" id="pw-current" placeholder="Current password" autocomplete="current-password" required maxlength="200">
                    <input type="password" id="pw-new" placeholder="New password (at least 10 characters)" autocomplete="new-password" required minlength="10" maxlength="200">
                    <input type="password" id="pw-confirm" placeholder="Confirm new password" autocomplete="new-password" required maxlength="200">
                    <div class="panel-buttons">
                        <button type="submit">Save password</button>
                        <button type="button" id="pw-cancel">Cancel</button>
                    </div>
                </form>
                <p id="account-note" role="status" aria-live="polite"></p>
            </div>
        </div>
    </div>
    <script type="module" src="./js/shell.js"></script>
    <script type="module" src="./js/account-page.js"></script>
</body>
</html>
