<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data</title>
    <link rel="stylesheet" href="./css/user-data.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">
    <link rel="icon" type="image/svg" href="./assets/admin-panel/favicon/student.svg">
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <div class="outer-card">
                <span id="title-container">
                    <img id="title-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-left-white.svg">
                    <p id="title">User Data</p>
                </span>
                <div class="inner-panel top-inner-card" id="filters">
                    <div class="tab-row" role="group" aria-label="User kind">
                        <button type="button" class="tab" data-type="all" aria-pressed="true">All <span id="count-all">0</span></button>
                        <button type="button" class="tab" data-type="registered" aria-pressed="false">Registered <span id="count-registered">0</span></button>
                        <button type="button" class="tab" data-type="guest" aria-pressed="false">Guests <span id="count-guest">0</span></button>
                    </div>
                    <div class="filter-row">
                        <input id="search-input" type="search" placeholder="Search name, roll no., phone or email" aria-label="Search users" maxlength="80">
                        <select id="usertype-filter" aria-label="Filter by user type">
                            <option value="">All user types</option>
                            <option value="student">Student</option>
                            <option value="staff">Teacher</option>
                            <option value="visitor">Visitor</option>
                        </select>
                    </div>
                </div>
                <div class="inner-panel table-panel">
                    <table id="users-table">
                        <thead>
                            <tr><th>Name</th><th>Contact / Roll no.</th><th>User type</th><th>Created on</th><th></th></tr>
                        </thead>
                        <tbody id="users-body"></tbody>
                    </table>
                </div>
                <div class="inner-panel bottom-inner-card" id="footer-row">
                    <p id="status-line" role="status" aria-live="polite">Loading...</p>
                    <button type="button" id="more-button" hidden>Load more</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./js/shell.js"></script>
    <script type="module" src="./js/user-data-page.js"></script>
</body>
</html>
