<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/login-find-admin-id-overlay.css">
    <link rel="icon" type="image/svg" href="./assets/admin-panel/favicon/ti-logo-without-name.svg">
</head>
<body>
    <div id="outer-card">
        <div id="inner-card">
            <h3 id="title">Request Password Reset</h3>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="number" placeholder="Phone Number" maxlength="10">
            <button id="findID">
                Send Request
            </button>
            <button id="cancel">
                Cancel
            </button>
        </div>
    </div>
</body>
</html>
