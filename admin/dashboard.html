<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">

    <link rel="icon" href="./assets/admin-panel/favicon/dashboard.svg">
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div class="quick-cards">
            <a class="quick-card quick-card--hostels" href="places-data.html?category=hostel">
                <span class="quick-card-title">Hostels</span>
                <span class="quick-card-count" data-count="hostel" hidden></span>
                <img class="quick-card-icon" src="./assets/admin-panel/dashboard/boys-hostel.svg" alt="" width="36" height="36">
            </a>
            <a class="quick-card quick-card--shops" href="places-data.html?category=food">
                <span class="quick-card-title">Shops</span>
                <span class="quick-card-count" data-count="food" hidden></span>
                <img class="quick-card-icon" src="./assets/admin-panel/dashboard/shops-icon.png" alt="" width="36" height="36">
            </a>
            <a class="quick-card quick-card--parks" href="places-data.html?category=other">
                <span class="quick-card-title">Parks &amp; Grounds</span>
                <span class="quick-card-count" data-count="other" hidden></span>
                <img class="quick-card-icon" src="./assets/admin-panel/dashboard/parks-icon.svg" alt="" width="36" height="36">
            </a>
            <a class="quick-card quick-card--classes" href="places-data.html?category=academic">
                <span class="quick-card-title">Classes</span>
                <span class="quick-card-count" data-count="academic" hidden></span>
                <img class="quick-card-icon" src="./assets/admin-panel/dashboard/classes-icon.svg" alt="" width="36" height="36">
            </a>
            <a class="quick-card quick-card--visitors" href="user-data.html">
                <span class="quick-card-title">Visitors</span>
                <span class="quick-card-count" data-count="visitor" hidden></span>
                <img class="quick-card-icon" src="./assets/admin-panel/dashboard/visitors-icon.svg" alt="" width="36" height="36">
            </a>
        </div>
    </div>

    <script type="module" src="./js/shell.js"></script>
    <script type="module" src="./js/dashboard-page.js"></script>
</body></html>
