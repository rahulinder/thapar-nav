<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">

    <link rel="icon" href="./assets/admin-panel/favicon/dashboard.svg">
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <input id="search-bar" type="text" placeholder="Sitewide search">
            <div id="shortcuts">
                <button class="pinned">
                    Broadcast message
                </button>
            </div>
            <p class="main-title">Stats</p>
            <div id="stats">
                <span id="left-side-stat" class="stats-block">
                    <p class="stats-right-border">Total Active Users</p>
                    <p class="stats-left-border">128</p>
                </span>
                <span class="stats-block">
                    <p class="stats-right-border">Active Rides</p>
                    <p class="stats-left-border">8</p>
                </span>
                <span id="right-side-stat" class="stats-block">
                    <p class="stats-right-border">Visitors in Campus</p>
                    <p class="stats-left-border">15</p>
                </span>
            </div>
            <p class="main-title">Quick Links</p>
            <div id="quick-links">
                <span>
                    <h4>Manage Users</h4>
                    <div id="users">
                        <button id="quick-student"><img src="./assets/admin-panel/dashboard/student.png"><p>Student</p></button>
                        <button id="quick-teacher"><img src="./assets/admin-panel/dashboard/teacher.png"><p>Teacher</p></button>
                        <button id="quick-visitor"><img src="./assets/admin-panel/dashboard/visitor.png"><p>Visitor</p></button>
                    
                    </div>            
                </span>
                <span>
                    <h4>Manage Accommodations</h4> 
                    <div id="accommodations">
                        <button><img src="./assets/admin-panel/dashboard/boys-hostel.svg">Boys Hostel</button>
                        <button><img src="./assets/admin-panel/dashboard/girls-hostel.svg">Girls Hostel</button>
                        <button><img src="./assets/admin-panel/dashboard/faculty-residence.svg">Faculty Residence</button>
                        <button><img src="./assets/admin-panel/dashboard/guest-accommodation.svg">Guest Accommodations</button>
                    </div>            
                </span>
                <span>
                    <h4>Manage Shops</h4>
                    <div id="shops">
                        <button><img src="./assets/admin-panel/dashboard/boys-hostel.svg">Boys Hostel</button>
                        <button><img src="./assets/admin-panel/dashboard/girls-hostel.svg">Girls Hostel</button>
                        <button><img src="./assets/admin-panel/dashboard/faculty-residence.svg">Faculty Residence</button>
                        <button><img src="./assets/admin-panel/dashboard/guest-accommodation.svg">Guest Accommodations</button>
                    </div>             
                </span>
            </div>
        </div>
    </div>
    
    <script type="module" src="./js/shell.js"></script>
</body></html>
