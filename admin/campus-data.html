<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Data</title>

    <link rel="stylesheet" href="./css/campus-data.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">
    <link rel="icon" type="image/svg" href="./assets/admin-panel/favicon/database.svg">
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <div class="outer-card">
                <span id="title-container">
                    <img id="title-arrow" src="./assets/admin-panel/campus-data/arrow-to-left-white.svg">
                    <p id="title">Campus Data</p>
                </span>
                <a class="inner-cards top-inner-card" href="./places-data.html">
                    <p class="card-title">All Places</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards " href="./places-data.html?category=hostel">
                    <p class="card-title">Accommodations</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards " href="./places-data.html?category=food">
                    <p class="card-title">Shops</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards " href="./places-data.html?category=academic">
                    <p class="card-title">Class Blocks</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards " href="./places-data.html?category=sports">
                    <p class="card-title">Parks &amp; Grounds</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards" href="./places-data.html?category=other">
                    <p class="card-title">Other Areas</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards" href="./path-editor.html">
                    <p class="card-title">Walking Paths</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
                <a class="inner-cards bottom-inner-card" href="./import-places.html">
                    <p class="card-title">Import Places (CSV)</p>
                    <img class="inner-card-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-right.svg">
                </a>
            </div>
        </div>
    </div>
    <script type="module" src="./js/shell.js"></script>
</body>
</html>
