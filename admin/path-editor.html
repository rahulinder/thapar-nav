<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Paths</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/path-editor.css">
    <link rel="stylesheet" href="./css/top-bar.css">
    <link rel="stylesheet" href="./css/side-bar.css">
    <link rel="icon" type="image/svg+xml" href="./assets/admin-panel/favicon/database.svg">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
</head>
<body hidden>
    <div id="top-bar-container"></div>
    <div id="dashboard-body">
        <div id="sidebar-container"></div>
        <div id="main-container">
            <div class="outer-card">
                <a id="title-container" href="./campus-data.html">
                    <img id="title-arrow" alt="" src="./assets/admin-panel/campus-data/arrow-to-left-white.svg">
                    <p id="title">Walking Paths</p>
                </a>
                <div id="modes" role="group" aria-label="Tools">
                    <button type="button" class="mode active" data-mode="select">Select &amp; move</button>
                    <button type="button" class="mode" data-mode="junction">Add junction</button>
                    <button type="button" class="mode" data-mode="connect">Draw walkway</button>
                    <label class="check light"><input id="show-places" type="checkbox" checked> Show places</label>
                </div>
                <p id="hint" role="status"></p>
                <div id="editor">
                    <div id="map" aria-label="Campus map"></div>
                    <aside id="panel" aria-live="polite"></aside>
                </div>
            </div>
            <div class="outer-card" id="history-card" data-limit="10">
                <p class="history-title">Edit History</p>
                <div class="history-panel">
                    <div class="tab-row" role="group" aria-label="What was changed">
                        <button type="button" class="tab" data-entity="" aria-pressed="true">All</button>
                        <button type="button" class="tab" data-entity="place" aria-pressed="false">Places</button>
                        <button type="button" class="tab" data-entity="walkway" aria-pressed="false">Walkways</button>
                        <button type="button" class="tab" data-entity="junction" aria-pressed="false">Junctions</button>
                    </div>
                    <div class="filter-row">
                        <input id="search-input" type="search" placeholder="Search by name or admin" aria-label="Search edit history" maxlength="80">
                        <select id="action-filter" aria-label="Filter by action">
                            <option value="">All actions</option>
                            <option value="created">Added</option>
                            <option value="updated">Changed</option>
                            <option value="deleted">Deleted</option>
                        </select>
                    </div>
                    <div class="history-scroll">
                        <table id="history-table">
                            <thead>
                                <tr><th>Date</th><th>Admin's Name</th><th>Action</th><th>Alteration</th><th>Details</th></tr>
                            </thead>
                            <tbody id="history-body"></tbody>
                        </table>
                    </div>
                    <div class="history-footer">
                        <p id="status-line" role="status" aria-live="polite">Loading...</p>
                        <button type="button" id="more-button" hidden>Load more</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./js/shell.js"></script>
    <script type="module" src="./js/path-page.js"></script>
    <script type="module" src="./js/edit-history-page.js"></script>
</body>
</html>
