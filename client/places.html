<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D1117">
    <title>Places - Thapar-Nav</title>

    <link rel="icon" type="image/svg+xml" href="./assets/common/ti-logo-without-name.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/places.css">

    <script type="module" src="./js/places-page.js"></script>
</head>
<body class="page-places">
    <section id="logo-and-search">
        <a href="index.html" aria-label="Thapar-Nav home"><img id="logo" src="./assets/common/ti-logo-with-white-name.svg" alt="Thapar-Nav"></a>
        <form id="search-bar" role="search">
            <input id="search-input" type="search" placeholder="Search Places" aria-label="Search places" maxlength="80">
            <ul id="search-suggestions" hidden></ul>
        </form>
        <a id="menu-toggle" href="menu.html" aria-label="Open menu"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="hostel-category" aria-label="Categories">
        <div id="category-chips"></div>
    </section>
    <div id="list-heading">
        <h2 id="page-title">Places</h2>
        <span id="result-count"></span>
    </div>
    <div id="places-list"></div>
<dialog id="place-panel"></dialog>
<script type="module" src="./js/menu-drawer.js"></script>
</body>
</html>
