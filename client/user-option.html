<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who are you? - Thapar-Nav</title>
    <link rel="icon" type="image/svg+xml" href="./assets/common/ti-logo-without-name.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/user-option.css">

    <script type="module" src="./js/role-page.js"></script>
</head>
<body>
    <h1 id="role-heading">I am a</h1>
    <section id="options" aria-labelledby="role-heading">
        <button type="button" class="role-option" id="student" data-role="student">
            <p>Student</p>
            <span><img src="./assets/client-interface/student.png" alt=""></span>
        </button>
        <button type="button" class="role-option" id="teacher" data-role="staff">
            <span><img src="./assets/client-interface/teacher.png" alt=""></span>
            <p>Teacher</p>
        </button>
        <button type="button" class="role-option" id="visitor" data-role="visitor">
            <p>Visitor</p>
            <span><img src="./assets/client-interface/visitor.png" alt=""></span>
        </button>
    </section>
</body>
</html>
