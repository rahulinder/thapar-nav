<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D1117">
    <title>Thapar-Nav</title>

    <link rel="icon" type="image/svg+xml" href="./assets/common/ti-logo-without-name.svg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/index.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script type="module" src="./js/home.js"></script>
</head>
<body class="page-home">
<main>
    <section id="logo-and-search">
        <a href="index.html" aria-label="Thapar-Nav home"><img id="logo" src="./assets/common/ti-logo-with-white-name.svg" alt="Thapar-Nav"></a>
        <form id="search-bar" role="search">
            <input id="search-input" type="search" placeholder="Search Places" aria-label="Search places" maxlength="80">
            <ul id="search-suggestions" hidden></ul>
        </form>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="cards-section">
        <p id="role-note"></p>
        <div id="home-map" class="cards">
            <div id="map" class="live-map-background" aria-label="Campus map"></div>
            <div class="map-tools" id="map-tools">
                <button data-label="Plan a route" type="button" id="directions-button" aria-label="Plan a route" title="Plan a route"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l16-8L4 4v6l10 2-10 2z"/></svg></button>
                <button data-label="Map or satellite" type="button" id="layer-button" class="is-active" aria-label="Switch to map view" title="Map view" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg></button>
                <button data-label="Expand map" type="button" id="expand-button" aria-label="Expand map" title="Expand map" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
                <button data-label="My location" type="button" id="locate-button" aria-label="Show my location" title="Show my location"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
            </div>
            <div id="map-message" role="status" aria-live="polite" hidden></div>
            <div class="card-details">
                <div class="location-row">
                    <img src="./assets/client-interface/cards/icons/current-location-icon.svg" alt="">
                    <h1 class="location-name" id="current-location">Main Gate</h1>
                </div>
                <button type="button" class="route-button" id="explore-button">Start Exploring</button>
            <div id="route-banner" role="status" aria-live="polite" hidden></div>
            <ol id="route-steps" hidden></ol>
            <section id="route-planner" aria-label="Plan a route" hidden>
                <div class="planner-field">
                    <label for="planner-from-input">From</label>
                    <form id="planner-from" class="planner-form">
                        <input id="planner-from-input" type="search" placeholder="My location" aria-label="Start place" maxlength="80">
                        <ul id="planner-from-list" class="planner-list" hidden></ul>
                    </form>
                    <button type="button" id="planner-from-me">My location</button>
                </div>
                <div class="planner-field">
                    <label for="planner-to-input">To</label>
                    <form id="planner-to" class="planner-form">
                        <input id="planner-to-input" type="search" placeholder="Choose a destination" aria-label="Destination place" maxlength="80">
                        <ul id="planner-to-list" class="planner-list" hidden></ul>
                    </form>
                    <button type="button" id="planner-close">Close</button>
                </div>
            </section>
            </div>
        </div>

        <div id="my-places" hidden></div>

        <div id="sections" aria-live="polite"></div>
    </section>
    <nav id="nav-bar" aria-label="Main">
        <a href="index.html" aria-label="Home"><img class="nav-icons" src="./assets/client-interface/nav-bar/Home.svg" alt=""></a>
        <a href="support.html" aria-label="Support"><img class="nav-icons" src="./assets/client-interface/nav-bar/Support.svg" alt=""></a>
        <a href="menu.html" aria-label="Menu"><img class="nav-icons" src="./assets/client-interface/nav-bar/Menu.svg" alt=""></a>
    </nav>
</main>
<dialog id="place-panel"></dialog>
<script type="module" src="./js/menu-drawer.js"></script>
</body>
</html>
